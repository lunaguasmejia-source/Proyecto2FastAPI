{% extends "base.html" %}
{% block title %}Iniciar sesión · TechGear{% endblock %}
{% block content %}
<form class="box" method="post">
  {% csrf_token %}
  <h2>Iniciar sesión</h2>

  <label>Entrar como</label>
  <div style="display:flex;gap:16px;margin-top:6px">
    <label style="font-weight:400"><input type="radio" name="rol" value="cliente" checked style="width:auto"> Cliente</label>
    <label style="font-weight:400"><input type="radio" name="rol" value="administrador" style="width:auto"> Administrador</label>
  </div>

  <label for="email">Correo</label>
  <input type="email" id="email" name="email" required>
  <label for="password">Contraseña</label>
  <input type="password" id="password" name="password" required>
  <button type="submit">Entrar</button>
  <p>¿No tienes cuenta? <a href="{% url 'registro' %}">Regístrate</a></p>
</form>
{% endblock %}
