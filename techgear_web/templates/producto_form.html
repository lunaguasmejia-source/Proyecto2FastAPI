{% extends "base.html" %}
{% load l10n %}
{% block title %}{% if modo == "editar" %}Editar producto{% else %}Nuevo producto{% endif %} · TechGear{% endblock %}
{% block content %}
<form class="box" method="post">
  {% csrf_token %}
  <h2>{% if modo == "editar" %}Editar producto{% else %}Nuevo producto{% endif %}</h2>

  <label for="nombre">Nombre</label>
  <input type="text" id="nombre" name="nombre" minlength="2" maxlength="100" value="{{ producto.nombre|default:'' }}" required>

  <label for="descripcion">Descripción</label>
  <input type="text" id="descripcion" name="descripcion" maxlength="500" value="{{ producto.descripcion|default:'' }}" required>

  <label for="precio">Precio</label>
  <input type="number" id="precio" name="precio" min="0.01" step="0.01" value="{{ producto.precio|unlocalize }}" required>

  <label for="stock">Stock</label>
  <input type="number" id="stock" name="stock" min="0" step="1" value="{{ producto.stock|unlocalize }}" required>

  <label for="categoria">Categoría</label>
  <input type="text" id="categoria" name="categoria" minlength="2" value="{{ producto.categoria|default:'' }}" required>

  <label for="imagen_url">URL de imagen (opcional)</label>
  <input type="url" id="imagen_url" name="imagen_url" value="{{ producto.imagen_url|default:'' }}" placeholder="https://...">

  <button type="submit">{% if modo == "editar" %}Guardar cambios{% else %}Guardar producto{% endif %}</button>
  <p><a href="{% url 'panel_admin' %}">Cancelar</a></p>
</form>
{% endblock %}
