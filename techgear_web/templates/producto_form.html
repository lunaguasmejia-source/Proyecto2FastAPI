{% extends "base.html" %}
{% block title %}Nuevo producto · TechGear{% endblock %}
{% block content %}
<form class="box" method="post">
  {% csrf_token %}
  <h2>Nuevo producto</h2>
  <label for="nombre">Nombre</label>
  <input type="text" id="nombre" name="nombre" minlength="2" maxlength="100" required>
  <label for="descripcion">Descripción</label>
  <input type="text" id="descripcion" name="descripcion" maxlength="500" required>
  <label for="precio">Precio</label>
  <input type="number" id="precio" name="precio" min="0.01" step="0.01" required>
  <label for="stock">Stock</label>
  <input type="number" id="stock" name="stock" min="0" step="1" required>
  <label for="categoria">Categoría</label>
  <input type="text" id="categoria" name="categoria" minlength="2" required>
  <label for="imagen_url">URL de imagen (opcional)</label>
  <input type="url" id="imagen_url" name="imagen_url">
  <button type="submit">Guardar producto</button>
</form>
{% endblock %}
