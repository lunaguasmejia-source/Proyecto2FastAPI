{% extends "base.html" %}
{% block title %}Registro · TechGear{% endblock %}
{% block content %}
<form class="box" method="post">
  {% csrf_token %}
  <h2>Crear cuenta</h2>
  <label for="nombre">Nombre</label>
  <input type="text" id="nombre" name="nombre" minlength="2" required>
  <label for="email">Correo</label>
  <input type="email" id="email" name="email" required>
  <label for="password">Contraseña (mín. 6)</label>
  <input type="password" id="password" name="password" minlength="6" maxlength="72" required>
  <button type="submit">Registrarme</button>
  <p>¿Ya tienes cuenta? <a href="{% url 'login' %}">Inicia sesión</a></p>
</form>
{% endblock %}
